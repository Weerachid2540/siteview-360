<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteView 360 — ดูรูป 360°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1c1e; --ink:#f3f4f5; --muted:#b9bec4;
  --glass:rgba(24,26,29,.55); --glass-line:rgba(255,255,255,.18);
  --accent:#f2b705; --fov:rgba(255,255,255,.85);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1a1c1e; } }
:root[data-theme="dark"]{ --bg:#1a1c1e; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
canvas{display:block;width:100%;height:100%}

.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
.bar>*{pointer-events:auto}
.title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.btn{appearance:none;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);
  height:40px;min-width:40px;padding:0 12px;border-radius:20px;font:inherit;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn svg{width:20px;height:20px}
.btn[aria-pressed="true"]{background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
.btn:focus-visible,.compass:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .lbl{display:none}
@media (min-width:640px){.btn .lbl{display:inline}}

/* Facebook-style FOV compass */
.compass{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  width:56px;height:56px;border-radius:50%;border:none;padding:0;background:transparent;cursor:pointer}
.compass svg{width:100%;height:100%;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

.strip{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55))}
.strip:empty{display:none}
.thumb{flex:0 0 auto;width:96px;height:48px;border-radius:6px;border:2px solid transparent;padding:0;
  background:#333 center/cover no-repeat;cursor:pointer}
.thumb[aria-current="true"]{border-color:var(--accent)}

.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 18px;border-radius:14px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:14px;text-align:center;pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}
.hint svg{width:36px;height:36px}

.drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);border:3px dashed var(--accent);font-size:20px;font-weight:600}
.drop.on{display:flex}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);
  max-width:min(92vw,480px);padding:10px 14px;border-radius:10px;background:var(--glass);backdrop-filter:blur(8px);
  font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
/* Drive folder browser */
.sheet{position:fixed;left:0;right:0;bottom:0;height:85%;display:none;flex-direction:column;
  background:rgba(22,24,27,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--glass-line);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{display:flex}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--glass-line)}
.crumbs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;font-size:14px}
.crumbs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;padding:4px 2px;cursor:pointer}
.crumbs button:last-child{color:var(--ink);font-weight:600}
.crumbs span{color:var(--muted)}
.sheet .btn{height:36px;min-width:36px;padding:0 10px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));grid-auto-rows:max-content;align-content:start;gap:14px}
.item{appearance:none;border:1px solid var(--glass-line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;
  border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;flex-shrink:0}
.item .pic{aspect-ratio:2/1;background:#2a2d31 center/cover no-repeat;position:relative}
.item .pic b{position:absolute;right:8px;top:8px;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent);color:#1a1c1e}
.item .nm{padding:8px 10px 2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .dt{padding:0 10px 9px;font-size:12px;color:var(--muted)}
.item.folder{flex-direction:row;align-items:center;gap:10px;padding:14px}
.item.folder .nm{padding:0}
.item.folder svg{flex:0 0 22px;height:22px;color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;padding:8px 2px;line-height:1.6}
.linkform{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.linkform input{height:42px;border-radius:10px;border:1px solid var(--glass-line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.linkform .btn{align-self:flex-start;background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){.hint,.toast{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="bar">
  <div class="title" id="title">ภาพตัวอย่าง</div>
  <label class="btn" title="เปิดรูป 360">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
    <span class="lbl">เปิดรูป</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </label>
  <button class="btn" id="driveBtn" title="รูปจากโฟลเดอร์ Google Drive">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M8 3l6 10h8M2 13h12l-4 7"/></svg>
    <span class="lbl">Google Drive</span>
  </button>
  <button class="btn" id="gyroBtn" aria-pressed="false" title="หมุนตามมือถือ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    <span class="lbl">หมุนตามเครื่อง</span>
  </button>
  <button class="btn" id="fsBtn" title="เต็มจอ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<button class="compass" id="compass" title="กลับทิศเริ่มต้น" aria-label="กลับทิศเริ่มต้น">
  <svg viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="26" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
    <path id="wedge" fill="var(--fov)"/>
    <circle cx="28" cy="28" r="4" fill="#fff"/>
    <path d="M28 1 l4 5 h-8z" fill="var(--accent)"/>
  </svg>
</button>

<div class="hint" id="hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
  ลากเพื่อหมุนดูรอบทิศ · ถ่างนิ้วหรือเลื่อนล้อเพื่อซูม
</div>
<div class="strip" id="strip"></div>
<section class="sheet" id="sheet" aria-label="รูปใน Google Drive">
  <div class="sheet-head">
    <nav class="crumbs" id="crumbs"></nav>
    <button class="btn" id="refreshBtn" title="โหลดรายการใหม่" aria-label="โหลดรายการใหม่">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
    <button class="btn" id="linkBtn" title="เปลี่ยนลิงก์โฟลเดอร์" aria-label="เปลี่ยนลิงก์โฟลเดอร์">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
    <button class="btn" id="closeSheet" title="ปิด" aria-label="ปิด">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="drop" id="drop">วางรูป 360 ที่นี่</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== ตั้งค่า Google Drive (จาก Google Cloud Console) ===== */
window.DRIVE_CONFIG = {
  API_KEY:   'AIzaSyBG4AQWcC3MCPBguqXik-yJgmgDPna_2I0',                               // API key (เปิด Drive API) — พอสำหรับโฟลเดอร์ที่แชร์แบบ "ทุกคนที่มีลิงก์"
  CLIENT_ID: 'YOUR_CLIENT_ID.apps.googleusercontent.com', // ใช้เมื่อโฟลเดอร์ไม่เปิดสาธารณะ (ล็อกอิน Google, scope drive.readonly)
  DEFAULT_FOLDER: ''                                       // วางลิงก์โฟลเดอร์บริษัทไว้ที่นี่ ทีมเปิดเว็บแล้วเจอเลย
};
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage');
const R = 500, FOV_MIN = 30, FOV_MAX = 100;

// ---------- three setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 1, 1100);
const maxTex = Math.min(renderer.capabilities.maxTextureSize, 8192);
let mesh = null;

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- view state ----------
let lon = 0, lat = 0, vLon = 0, vLat = 0;
let latLimit = 85;              // changes for partial (non-2:1) panoramas
let dragging = false, interacted = false;
const pointers = new Map();
let lastX = 0, lastY = 0, lastT = 0, pinchDist = 0;

function setPano(img, name){
  // Downscale if bigger than GPU allows (Osmo 360 photos can exceed 8K)
  let src = img, w = img.width, h = img.height;
  if (w > maxTex){
    const s = maxTex / w, c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    src = c;
  }
  const tex = new THREE.Texture(src);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  tex.needsUpdate = true;

  // 2:1 => full sphere; wider => partial vertical coverage (phone panoramas)
  const aspect = w / h;
  const vDeg = Math.min(180, 360 / aspect);
  const theta0 = THREE.MathUtils.degToRad((180 - vDeg) / 2);
  const geo = new THREE.SphereGeometry(R, 64, 48, 0, Math.PI * 2, theta0, THREE.MathUtils.degToRad(vDeg));
  geo.scale(-1, 1, 1);
  if (mesh){ mesh.geometry.dispose(); mesh.material.map.dispose(); mesh.material.dispose(); scene.remove(mesh); }
  mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
  scene.add(mesh);

  latLimit = vDeg >= 179 ? 85 : Math.max(0, vDeg / 2 - camera.fov / 2);
  lon = 0; lat = 0; vLon = vLat = 0;
  $('title').textContent = name;
  if (Math.abs(aspect - 2) > 0.05) toast(`รูปไม่ใช่สัดส่วน 2:1 (${aspect.toFixed(2)}:1) — แสดงเป็นพาโนรามาบางส่วน`);
}

// ---------- demo pano (test grid) ----------
function demoPano(){
  const c = document.createElement('canvas'); c.width = 4096; c.height = 2048;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,1024); sky.addColorStop(0,'#5b87b8'); sky.addColorStop(1,'#cfd9e2');
  g.fillStyle = sky; g.fillRect(0,0,4096,1024);
  const gr = g.createLinearGradient(0,1024,0,2048); gr.addColorStop(0,'#8a8173'); gr.addColorStop(1,'#4b463f');
  g.fillStyle = gr; g.fillRect(0,1024,4096,1024);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
  for (let x=0;x<=4096;x+=4096/36){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,2048); g.stroke(); }
  for (let y=0;y<=2048;y+=2048/18){ g.beginPath(); g.moveTo(0,y); g.lineTo(4096,y); g.stroke(); }
  g.fillStyle = '#fff'; g.font = '600 120px "IBM Plex Sans Thai", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  [['N',0],['E',90],['S',180],['W',270]].forEach(([t,d]) => {
    const x = ((d + 180) % 360) / 360 * 4096;   // lon 0 = image centre
    g.fillText(t, x, 900);
  });
  g.font = '400 56px "IBM Plex Sans Thai", sans-serif';
  g.fillText('กด "เปิดรูป" เพื่อเลือกรูป 360 จากเครื่อง', 2048, 1180);
  return c;
}

// ---------- input: drag / inertia / zoom ----------
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, e);
  if (pointers.size === 1){
    dragging = true; stage.classList.add('dragging');
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); vLon = vLat = 0;
  } else if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinchDist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  }
  markInteracted();
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (pinchDist) zoomBy(pinchDist / d);
    pinchDist = d; return;
  }
  if (!dragging) return;
  // degrees per pixel scale with FOV, so dragging feels 1:1 with the image
  const k = camera.fov / innerHeight;
  const dx = (e.clientX - lastX) * k, dy = (e.clientY - lastY) * k;
  const now = performance.now(), dt = Math.max(1, now - lastT);
  if (gyroOn){ gyroOffset += THREE.MathUtils.degToRad(dx); }
  else { lon -= dx; lat += dy; }
  vLon = -dx / dt * 16; vLat = dy / dt * 16;
  lastX = e.clientX; lastY = e.clientY; lastT = now;
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0){
    dragging = false; stage.classList.remove('dragging');
    if (performance.now() - lastT > 80 || matchMedia('(prefers-reduced-motion: reduce)').matches) vLon = vLat = 0;
  } else {
    const p = [...pointers.values()][0]; lastX = p.clientX; lastY = p.clientY;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * 0.001)); markInteracted(); }, { passive:false });
stage.addEventListener('dblclick', () => zoomBy(camera.fov > 60 ? 0.6 : 1.6));

function zoomBy(f){
  camera.fov = THREE.MathUtils.clamp(camera.fov * f, FOV_MIN, FOV_MAX);
  camera.updateProjectionMatrix();
}
function markInteracted(){ if (!interacted){ interacted = true; $('hint').classList.add('gone'); } }

// ---------- gyroscope ----------
let gyroOn = false, gyroOffset = 0, orient = null;
const zee = new THREE.Vector3(0,0,1), euler = new THREE.Euler(), q0 = new THREE.Quaternion(),
      q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
function onOrient(e){ orient = e; }
$('gyroBtn').addEventListener('click', async () => {
  if (gyroOn){ gyroOn = false; $('gyroBtn').setAttribute('aria-pressed','false'); removeEventListener('deviceorientation', onOrient); return; }
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') throw new Error('denied');
    }
    if (!('DeviceOrientationEvent' in window)) throw new Error('none');
    addEventListener('deviceorientation', onOrient);
    gyroOn = true; gyroOffset = 0; $('gyroBtn').setAttribute('aria-pressed','true');
    markInteracted();
    setTimeout(() => { if (gyroOn && !orient) toast('อุปกรณ์นี้ไม่ส่งข้อมูลเซนเซอร์ (ต้องเปิดผ่าน https บนมือถือ)'); }, 1500);
  } catch { toast('ไม่ได้รับสิทธิ์ใช้เซนเซอร์หมุน — ลากนิ้วเพื่อหมุนแทนได้'); }
});
function applyGyro(){
  const a = THREE.MathUtils.degToRad(orient.alpha || 0) + gyroOffset;
  const b = THREE.MathUtils.degToRad(orient.beta || 0);
  const g = THREE.MathUtils.degToRad(orient.gamma || 0);
  const s = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  euler.set(b, a, -g, 'YXZ');
  camera.quaternion.setFromEuler(euler);
  camera.quaternion.multiply(q1);
  camera.quaternion.multiply(q0.setFromAxisAngle(zee, -s));
}

// ---------- compass (Facebook-style FOV wedge) ----------
const wedge = $('wedge'), dir = new THREE.Vector3();
function drawCompass(){
  camera.getWorldDirection(dir);
  const yaw = Math.atan2(dir.x, -dir.z);  // 0 = start direction, clockwise
  const hFov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const r = 24, a0 = yaw - hFov / 2, a1 = yaw + hFov / 2;
  const p = a => `${28 + r * Math.sin(a)} ${28 - r * Math.cos(a)}`;
  wedge.setAttribute('d', `M28 28 L${p(a0)} A${r} ${r} 0 ${hFov > Math.PI ? 1 : 0} 1 ${p(a1)} Z`);
}
$('compass').addEventListener('click', () => {
  if (gyroOn){ camera.getWorldDirection(dir); gyroOffset -= Math.atan2(dir.x, -dir.z); }
  else { lon = 0; lat = 0; vLon = vLat = 0; }
  camera.fov = 75; camera.updateProjectionMatrix();
});

// ---------- loop ----------
const target = new THREE.Vector3();
let t0 = performance.now();
function loop(now){
  const dt = Math.min(64, now - t0); t0 = now;
  if (gyroOn && orient){ applyGyro(); }
  else {
    if (!dragging){
      if (!interacted && !matchMedia('(prefers-reduced-motion: reduce)').matches) lon += dt * 0.004; // gentle intro spin
      lon += vLon; lat += vLat; vLon *= 0.92; vLat *= 0.92;
      if (Math.abs(vLon) < 0.001) vLon = 0; if (Math.abs(vLat) < 0.001) vLat = 0;
    }
    lat = THREE.MathUtils.clamp(lat, -latLimit, latLimit);
    const phi = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon - 90);
    target.set(R * Math.sin(phi) * Math.cos(th), R * Math.cos(phi), R * Math.sin(phi) * Math.sin(th));
    camera.lookAt(target);
  }
  drawCompass();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---------- files / gallery ----------
const items = [];
async function addFiles(files){
  const added = [];
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const url = URL.createObjectURL(f);
    const img = new Image(); img.src = url;
    try { await img.decode(); } catch { toast(`เปิดไฟล์ ${f.name} ไม่ได้`); continue; }
    const item = { name: f.name, img, url };
    items.push(item); added.push(item);
    const b = document.createElement('button');
    b.className = 'thumb'; b.style.backgroundImage = `url("${url}")`; b.title = f.name; b.setAttribute('aria-label', f.name);
    b.onclick = () => select(item, b);
    $('strip').appendChild(b);
    item.btn = b;
  }
  if (added.length) select(added[added.length - 1], added[added.length - 1].btn);
  return added;
}
function select(item, btn){
  document.querySelectorAll('.thumb').forEach(t => t.removeAttribute('aria-current'));
  btn.setAttribute('aria-current','true');
  setPano(item.img, item.name);
}
$('file').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('drop').classList.add('on'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('drop').classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').classList.remove('on'); addFiles([...e.dataTransfer.files]); });

$('fsBtn').addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else toast('เบราว์เซอร์นี้ไม่รองรับโหมดเต็มจอ');
});

let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3500); }

// ---------- Google Drive folder sync ----------
const DC = window.DRIVE_CONFIG || {};
const hasKey = DC.API_KEY && !DC.API_KEY.startsWith('YOUR_');
const hasClient = DC.CLIENT_ID && !DC.CLIENT_ID.startsWith('YOUR_');
const API = 'https://www.googleapis.com/drive/v3/files';
let token = null, tokenExp = 0, tokenClient = null;
let rootId = null, path = [];            // path = [{id,name}, ...]
const driveCache = new Map();            // fileId -> viewer item

function parseFolderId(txt){
  txt = (txt || '').trim();
  const m = txt.match(/\/folders\/([\w-]{10,})/) || txt.match(/[?&]id=([\w-]{10,})/);
  if (m) return m[1];
  return /^[\w-]{20,}$/.test(txt) ? txt : null;
}
function store(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function load(k){ try { return localStorage.getItem(k); } catch { return null; } }

function waitFor(test, ms = 8000){
  return new Promise((res, rej) => { const t0 = Date.now();
    (function tick(){ if (test()) res(); else if (Date.now() - t0 > ms) rej(new Error('timeout')); else setTimeout(tick, 100); })(); });
}
async function signIn(){
  if (!hasClient) throw new Error('private');
  await waitFor(() => window.google && google.accounts && google.accounts.oauth2);
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DC.CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.readonly', callback: () => {} });
  return new Promise((res, rej) => {
    tokenClient.callback = r => { if (r.error) return rej(new Error(r.error));
      token = r.access_token; tokenExp = Date.now() + r.expires_in * 1000; store('sv360.signedin', '1'); res(); };
    tokenClient.error_callback = e => rej(new Error(e.type || 'popup'));
    tokenClient.requestAccessToken({ prompt: token ? '' : 'select_account' });
  });
}
// ลองด้วย API key ก่อน (โฟลเดอร์แชร์ทุกคนที่มีลิงก์) ถ้าไม่ได้ค่อยล็อกอิน
async function api(url, asBlob = false){
  const go = () => {
    const u = new URL(url), h = {};
    u.searchParams.set('supportsAllDrives', 'true');
    if (token && Date.now() < tokenExp - 60000) h.Authorization = `Bearer ${token}`;
    else if (hasKey) u.searchParams.set('key', DC.API_KEY);
    return fetch(u, { headers: h });
  };
  let r = await go();
  if ((r.status === 401 || r.status === 403 || r.status === 404) && hasClient){
    if (!navigator.userActivation || !navigator.userActivation.isActive) throw new Error('needtap');
    await signIn(); r = await go();
  }
  if (!r.ok) throw new Error(r.status === 404 ? 'notfound' : r.status === 403 ? 'forbidden' : `HTTP ${r.status}`);
  return asBlob ? r : r.json();
}
async function listFolder(id){
  const out = []; let page = '';
  do {
    const u = new URL(API);
    u.searchParams.set('q', `'${id}' in parents and trashed = false and (mimeType = 'application/vnd.google-apps.folder' or mimeType contains 'image/')`);
    u.searchParams.set('fields', 'nextPageToken,files(id,name,mimeType,modifiedTime,size,thumbnailLink,imageMediaMetadata(width,height))');
    u.searchParams.set('orderBy', 'folder,modifiedTime desc');
    u.searchParams.set('pageSize', '200');
    u.searchParams.set('includeItemsFromAllDrives', 'true');
    if (page) u.searchParams.set('pageToken', page);
    const j = await api(u.toString());
    out.push(...j.files); page = j.nextPageToken;
  } while (page);
  return out;
}

const sheet = $('sheet'), body = $('sheetBody'), crumbs = $('crumbs');
const fmtDate = t => new Date(t).toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' });
const folderIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

function showLinkForm(msg){
  crumbs.innerHTML = '<span>เชื่อมโฟลเดอร์ Google Drive</span>';
  body.innerHTML = `<form class="linkform" id="linkForm">
    <div class="empty">${msg || 'วางลิงก์โฟลเดอร์ Google Drive ที่ทีมใช้อัปรูป 360'}</div>
    <input id="linkInput" type="url" inputmode="url" placeholder="https://drive.google.com/drive/folders/..." value="${rootId ? 'https://drive.google.com/drive/folders/' + rootId : ''}">
    <button class="btn" type="submit">${hasClient ? 'เชื่อมโฟลเดอร์ / ล็อกอิน Google' : 'เชื่อมโฟลเดอร์'}</button></form>`;
  $('linkForm').onsubmit = e => { e.preventDefault();
    const id = parseFolderId($('linkInput').value);
    if (!id){ toast('ลิงก์ไม่ถูกต้อง ต้องเป็นลิงก์โฟลเดอร์ (…/folders/…)'); return; }
    connect(id);
  };
}
async function connect(id){
  rootId = id; path = []; store('sv360.folder', id);
  body.innerHTML = '<div class="empty">กำลังเชื่อม…</div>';
  try {
    const meta = await api(`${API}/${id}?fields=name,mimeType`);
    if (meta.mimeType !== 'application/vnd.google-apps.folder') throw new Error('notfolder');
    path = [{ id, name: meta.name }];
    await renderFolder();
  } catch (e){ handleErr(e); }
}
function handleErr(e){
  const m = String(e.message || e);
  const msg = m === 'notfolder' ? 'ลิงก์นี้ไม่ใช่โฟลเดอร์'
    : m === 'private' || m === 'forbidden' || m === 'notfound'
      ? (hasClient ? 'เข้าถึงโฟลเดอร์ไม่ได้ — บัญชีที่ล็อกอินต้องมีสิทธิ์ดูโฟลเดอร์นี้' : 'โฟลเดอร์นี้ไม่ได้เปิด "ทุกคนที่มีลิงก์" และยังไม่ได้ตั้ง CLIENT_ID สำหรับล็อกอิน')
    : m === 'needtap' ? 'โฟลเดอร์นี้ต้องล็อกอิน Google — กดปุ่มด้านล่าง'
    : m === 'timeout' ? 'โหลดสคริปต์ Google ไม่ได้ ตรวจอินเทอร์เน็ต'
    : m.includes('popup') ? 'หน้าต่างล็อกอินถูกปิดหรือถูกบล็อก'
    : `เชื่อมไม่ได้: ${m}`;
  showLinkForm(msg);
}
async function renderFolder(){
  const cur = path[path.length - 1];
  crumbs.innerHTML = '';
  path.forEach((p, i) => {
    if (i) crumbs.insertAdjacentHTML('beforeend', '<span>›</span>');
    const b = document.createElement('button'); b.textContent = p.name;
    b.onclick = () => { path = path.slice(0, i + 1); renderFolder(); };
    crumbs.appendChild(b);
  });
  crumbs.scrollLeft = crumbs.scrollWidth;
  body.innerHTML = '<div class="empty">กำลังโหลดรายการ…</div>';
  let files;
  try { files = await listFolder(cur.id); } catch (e){ return handleErr(e); }
  if (path[path.length - 1] !== cur) return;   // user navigated away meanwhile
  body.innerHTML = '';
  if (!files.length){ body.innerHTML = '<div class="empty">โฟลเดอร์นี้ยังไม่มีรูป</div>'; return; }
  for (const f of files){
    const el = document.createElement('button'); el.className = 'item';
    if (f.mimeType === 'application/vnd.google-apps.folder'){
      el.classList.add('folder');
      el.innerHTML = folderIcon + '<span class="nm"></span>';
      el.querySelector('.nm').textContent = f.name;
      el.onclick = () => { path.push({ id: f.id, name: f.name }); renderFolder(); };
    } else {
      const md = f.imageMediaMetadata || {}, r = md.width && md.height ? md.width / md.height : 0;
      el.innerHTML = `<div class="pic">${Math.abs(r - 2) < 0.05 ? '<b>360°</b>' : ''}</div><div class="nm"></div><div class="dt"></div>`;
      el.querySelector('.nm').textContent = f.name;
      el.querySelector('.dt').textContent = fmtDate(f.modifiedTime) + (f.size ? ` · ${(f.size / 1048576).toFixed(1)} MB` : '');
      if (f.thumbnailLink){
        const im = new Image(); im.referrerPolicy = 'no-referrer';
        im.onload = () => { el.querySelector('.pic').style.backgroundImage = `url("${im.src}")`; };
        im.src = f.thumbnailLink.replace(/=s\d+$/, '=s800');
      }
      el.onclick = () => openDriveImage(f);
    }
    body.appendChild(el);
  }
}
async function openDriveImage(f){
  if (driveCache.has(f.id + f.modifiedTime)){ const it = driveCache.get(f.id + f.modifiedTime); select(it, it.btn); sheet.classList.remove('on'); return; }
  try {
    const r = await api(`${API}/${f.id}?alt=media`, true);
    const total = +f.size || +r.headers.get('content-length') || 0;
    const reader = r.body.getReader(), chunks = []; let got = 0;
    for (;;){ const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length;
      toast(`กำลังโหลด ${f.name}${total ? ` ${Math.round(got / total * 100)}%` : ''}`); }
    const file = new File(chunks, f.name, { type: f.mimeType || 'image/jpeg' });
    const [it] = await addFiles([file]);
    if (it){ driveCache.set(f.id + f.modifiedTime, it); sheet.classList.remove('on'); toast(f.name); }
  } catch (e){ toast(`โหลด ${f.name} ไม่ได้ (${e.message})`); }
}

$('driveBtn').addEventListener('click', () => {
  if (!hasKey && !hasClient){ toast('ยังไม่ได้ใส่ API_KEY ใน DRIVE_CONFIG'); return; }
  const open = sheet.classList.toggle('on');
  if (open && !path.length){ rootId ? connect(rootId) : showLinkForm(); }
});
$('closeSheet').onclick = () => sheet.classList.remove('on');
$('refreshBtn').onclick = () => path.length ? renderFolder() : rootId && connect(rootId);
$('linkBtn').onclick = () => showLinkForm();
addEventListener('keydown', e => { if (e.key === 'Escape') sheet.classList.remove('on'); });

// โฟลเดอร์เริ่มต้น: ?folder=ลิงก์หรือID  >  ที่เคยเชื่อมไว้  >  DEFAULT_FOLDER
rootId = parseFolderId(new URLSearchParams(location.search).get('folder')) || load('sv360.folder') || parseFolderId(DC.DEFAULT_FOLDER);
if (rootId && (hasKey || hasClient)) setTimeout(() => { sheet.classList.add('on'); connect(rootId); }, 300);

// start
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  setPano(demoPano(), 'ภาพตัวอย่าง (กริดทดสอบทิศ)');
  requestAnimationFrame(loop);
});
})();
